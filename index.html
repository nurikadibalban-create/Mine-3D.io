<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MineFun Real Voxel</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
    #instructions {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer; z-index: 10;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      background: rgba(255, 255, 255, 0.9); border: 1px solid #000;
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>

  <div id="instructions">
    <h1>MineFun Game</h1>
    <p>اضغط في أي مكان للبدء</p>
    <p><strong>WASD</strong>: تحرك | <strong>SPACE</strong>: قفز</p>
    <p><strong>يسار الماوس</strong>: تكسير | <strong>يمين الماوس</strong>: بناء</p>
  </div>

  <div id="crosshair"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x78a7ff); // لون سماء ماين كرافت
    scene.fog = new THREE.Fog(0x78a7ff, 10, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');

    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => instructions.style.display = 'flex');

    scene.add(controls.getObject());

    // تحصيل صور خامات ماين كرافت المفتوحة
    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    // خامة العشب والتراب والحجر من خوادم ماين كرافت المجانية
    const grassTopTexture = textureLoader.load('https://threejs.org/examples/textures/minecraft/grass.png');
    const dirtTexture = textureLoader.load('https://threejs.org/examples/textures/minecraft/dirt.png');
    
    // ضبط جودة البكسل لتكون ضبابية مثل ماين كرافت (Pixel Art)
    grassTopTexture.magFilter = THREE.NearestFilter;
    dirtTexture.magFilter = THREE.NearestFilter;

    // خامة كتل العشب (أعلى أخضر، والجانب تراب مع عشب)
    const grassMaterials = [
      new THREE.MeshLambertMaterial({ map: dirtTexture }), // جانب
      new THREE.MeshLambertMaterial({ map: dirtTexture }), // جانب
      new THREE.MeshLambertMaterial({ map: grassTopTexture }), // أعلى
      new THREE.MeshLambertMaterial({ map: dirtTexture }), // أسفل
      new THREE.MeshLambertMaterial({ map: dirtTexture }), // جانب
      new THREE.MeshLambertMaterial({ map: dirtTexture })  // جانب
    ];

    const objects = [];
    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
    
    // خامة الحدود حول كل مكعب لتحديد أطرافه وضمان تجسيمه 3D
    const edgesGeometry = new THREE.EdgesGeometry(boxGeometry);
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 });

    function createBlock(x, y, z) {
      const cube = new THREE.Mesh(boxGeometry, grassMaterials);
      cube.position.set(x, y, z);
      
      // إضافة خطوط سوداء خفيفة على أطراف المكعب ليظهر بشكل متجسم
      const wireframe = new THREE.LineSegments(edgesGeometry, lineMaterial);
      cube.add(wireframe);

      scene.add(cube);
      objects.push(cube);
    }

    // بناء أرضية مع تضاريس متباينة الأرتفاع (مثل ماين كرافت)
    const worldSize = 12;
    for (let x = -worldSize; x <= worldSize; x++) {
      for (let z = -worldSize; z <= worldSize; z++) {
        // حساب الارتفاع لإنشاء تلال بسيطة
        let height = Math.floor(Math.sin(x * 0.3) + Math.cos(z * 0.3));
        createBlock(x, height, z);
      }
    }

    // موقع بداية الكاميرا
    controls.getObject().position.set(0, 4, 0);

    // نظام الحركة والفيزياء
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
      if (e.code === 'Space' && canJump) {
        velocity.y += 10;
        canJump = false;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
    });

    // نظام التكسير والبناء
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    window.addEventListener('mousedown', (e) => {
      if (!controls.isLocked) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects);

      if (intersects.length > 0) {
        const intersect = intersects[0];

        if (e.button === 0) { // تكسير
          scene.remove(intersect.object);
          objects.splice(objects.indexOf(intersect.object), 1);
        } else if (e.button === 2) { // بناء
          const pos = intersect.object.position.clone().add(intersect.face.normal);
          createBlock(pos.x, pos.y, pos.z);
        }
      }
    });

    window.addEventListener('contextmenu', e => e.preventDefault());

    // حلقة التحديث والرسم
    let prevTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 25.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
        controls.getObject().position.y += velocity.y * delta;

        if (controls.getObject().position.y < 2) {
          velocity.y = 0;
          controls.getObject().position.y = 2;
          canJump = true;
        }

        prevTime = time;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
