<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>MineFun Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instructions {
            position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
            color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>اضغط هنا للعب (MineFun Style)</h2>
        <p>التحرك: WASD | القفز: SPACE | النظر: حرك الماوس</p>
    </div>
    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- الإعدادات الأساسية (The Setup) ---
        let scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // لون السماء

        let camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 2; // ارتفاع الشخصية عن الأرض

        let renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- الإضاءة (Lighting) ---
        let ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        let directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 0.5).normalize();
        scene.add(directionalLight);

        // --- التحكم والشخصية (Controls) ---
        let controls = new THREE.PointerLockControls(camera, document.body);
        let instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => instructions.style.display = 'none');
        controls.addEventListener('unlock', () => instructions.style.display = 'block');

        // --- بناء العالم (Voxel World) ---
        let cubeSize = 1;
        let gridSize = 20; // حجم الخريطة 20x20 مكعب
        let blocks = [];

        // خامة المكعب (Texture) - هنا نستخدم ألوان بسيطة للتوضيح
        let geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        let material = new THREE.MeshLambertMaterial({ color: 0x4aa344 }); // لون العشب

        // إنشاء الأرضية
        for (let x = -gridSize / 2; x < gridSize / 2; x++) {
            for (let z = -gridSize / 2; z < gridSize / 2; z++) {
                let cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, 0, z);
                scene.add(cube);
                blocks.push(cube);
            }
        }

        // --- الفيزياء والحركة (Physics & Movement) ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 10; canJump = false; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // --- حلقة التحديث والرسم (Game Loop) ---
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                let time = performance.now();
                let delta = (time - prevTime) / 1000;

                // الاحتكاك (تباطؤ الحركة)
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; // قوة الجاذبية

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                // تطبيق الحركة
                if (moveForward || moveBackward) velocity.z -= direction.z * 60.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 60.0 * delta;

                // منع السقوط اللانهائي (على مستوى المكعبات الأساسي)
                if (camera.position.y < 2) {
                    velocity.y = 0;
                    camera.position.y = 2;
                    canJump = true;
                }

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                prevTime = time;
            }

            renderer.render(scene, camera);
        }

        animate();

        // ضبط حجم الرندر عند تغيير حجم المتصفح
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
