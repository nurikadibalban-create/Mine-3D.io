<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineFun - 2D Voxel Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #87CEEB;
            display: block;
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
        }
        #hotbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px;
            border-radius: 5px;
            border: 2px solid #555;
        }
        .slot {
            width: 44px;
            height: 44px;
            border: 2px solid #777;
            margin: 0 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            font-size: 12px;
            font-weight: bold;
        }
        .slot.selected {
            border-color: #fff;
            box-shadow: 0 0 8px #fff;
            background: rgba(255, 255, 255, 0.3);
        }
        .block-preview {
            width: 20px;
            height: 20px;
            border: 1px solid #000;
        }
        .count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="800" height="480"></canvas>
    <div id="ui">
        <div>Left Click: Mine | Right Click: Place</div>
        <div>A/D or Arrows: Move | Space/W: Jump</div>
        <div>Keys 1-7: Select Hotbar Slot</div>
    </div>
    <div id="hotbar"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- GAME CONFIGURATION ---
const TILE_SIZE = 32;
const WORLD_WIDTH = 100;  // Tiles wide
const WORLD_HEIGHT = 60;  // Tiles high
const GRAVITY = 0.5;

// --- BLOCK TYPES & PROPERTIES ---
const BLOCKS = {
    AIR: 0,
    GRASS: 1,
    DIRT: 2,
    STONE: 3,
    COAL: 4,
    IRON: 5,
    GOLD: 6,
    DIAMOND: 7
};

const BLOCK_DATA = {
    [BLOCKS.GRASS]:   { name: 'Grass',   color: '#55a826', solid: true },
    [BLOCKS.DIRT]:    { name: 'Dirt',    color: '#866043', solid: true },
    [BLOCKS.STONE]:   { name: 'Stone',   color: '#757575', solid: true },
    [BLOCKS.COAL]:    { name: 'Coal',    color: '#333333', solid: true },
    [BLOCKS.IRON]:    { name: 'Iron',    color: '#d1b18a', solid: true },
    [BLOCKS.GOLD]:    { name: 'Gold',    color: '#fada5e', solid: true },
    [BLOCKS.DIAMOND]: { name: 'Diamond', color: '#4ee2ec', solid: true }
};

// --- GAME STATE ---
let world = [];
let keys = {};
let selectedSlot = 0;

const player = {
    x: (WORLD_WIDTH / 2) * TILE_SIZE,
    y: 0,
    width: 20,
    height: 52,
    vx: 0,
    vy: 0,
    speed: 3.5,
    jumpStrength: 9.5,
    grounded: false
};

const inventory = [
    { type: BLOCKS.GRASS, count: 10 },
    { type: BLOCKS.DIRT, count: 20 },
    { type: BLOCKS.STONE, count: 10 },
    { type: BLOCKS.COAL, count: 0 },
    { type: BLOCKS.IRON, count: 0 },
    { type: BLOCKS.GOLD, count: 0 },
    { type: BLOCKS.DIAMOND, count: 0 }
];

// --- WORLD GENERATION ---
function generateWorld() {
    world = Array(WORLD_HEIGHT).fill(0).map(() => Array(WORLD_WIDTH).fill(BLOCKS.AIR));

    // Simple heightmap terrain generation
    let groundHeight = Math.floor(WORLD_HEIGHT / 3);
    
    for (let x = 0; x < WORLD_WIDTH; x++) {
        // Vary height slightly
        if (x > 0 && Math.random() < 0.4) {
            groundHeight += Math.random() < 0.5 ? 1 : -1;
            groundHeight = Math.max(10, Math.min(WORLD_HEIGHT - 20, groundHeight));
        }

        for (let y = groundHeight; y < WORLD_HEIGHT; y++) {
            if (y === groundHeight) {
                world[y][x] = BLOCKS.GRASS;
            } else if (y < groundHeight + 4) {
                world[y][x] = BLOCKS.DIRT;
            } else {
                // Stone layer with ores
                const rand = Math.random();
                if (rand < 0.01) world[y][x] = BLOCKS.DIAMOND;
                else if (rand < 0.03) world[y][x] = BLOCKS.GOLD;
                else if (rand < 0.07) world[y][x] = BLOCKS.IRON;
                else if (rand < 0.12) world[y][x] = BLOCKS.COAL;
                else world[y][x] = BLOCKS.STONE;
            }
        }
    }

    // Spawn player above terrain
    player.y = (groundHeight - 3) * TILE_SIZE;
}

// --- ENGINE & LOGIC ---
function updatePlayer() {
    // Horizontal Movement
    if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
    else if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;
    else player.vx = 0;

    // Jumping
    if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.grounded) {
        player.vy = -player.jumpStrength;
        player.grounded = false;
    }

    // Gravity
    player.vy += GRAVITY;

    // Apply Velocity & Horizontal Collision
    player.x += player.vx;
    handleCollision(true);

    // Vertical Collision
    player.y += player.vy;
    player.grounded = false;
    handleCollision(false);
}

function handleCollision(horizontal) {
    const left = Math.floor(player.x / TILE_SIZE);
    const right = Math.floor((player.x + player.width) / TILE_SIZE);
    const top = Math.floor(player.y / TILE_SIZE);
    const bottom = Math.floor((player.y + player.height) / TILE_SIZE);

    for (let y = top; y <= bottom; y++) {
        for (let x = left; x <= right; x++) {
            if (isSolid(x, y)) {
                if (horizontal) {
                    if (player.vx > 0) player.x = x * TILE_SIZE - player.width;
                    if (player.vx < 0) player.x = (x + 1) * TILE_SIZE;
                    player.vx = 0;
                } else {
                    if (player.vy > 0) {
                        player.y = y * TILE_SIZE - player.height;
                        player.grounded = true;
                        player.vy = 0;
                    } else if (player.vy < 0) {
                        player.y = (y + 1) * TILE_SIZE;
                        player.vy = 0;
                    }
                }
            }
        }
    }
}

function isSolid(x, y) {
    if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) return true;
    const block = world[y][x];
    return block !== BLOCKS.AIR && BLOCK_DATA[block]?.solid;
}

// --- RENDER ---
function render() {
    // Camera follow player
    const cameraX = player.x - canvas.width / 2 + player.width / 2;
    const cameraY = player.y - canvas.height / 2 + player.height / 2;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

    // Render Visible Blocks
    const startX = Math.max(0, Math.floor(cameraX / TILE_SIZE));
    const endX = Math.min(WORLD_WIDTH, Math.ceil((cameraX + canvas.width) / TILE_SIZE));
    const startY = Math.max(0, Math.floor(cameraY / TILE_SIZE));
    const endY = Math.min(WORLD_HEIGHT, Math.ceil((cameraY + canvas.height) / TILE_SIZE));

    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            const block = world[y][x];
            if (block !== BLOCKS.AIR) {
                ctx.fillStyle = BLOCK_DATA[block].color;
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    // Render Player
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    // Eye detail
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 12, player.y + 8, 4, 4);

    ctx.restore();
}

// --- HOTBAR & INVENTORY UI ---
function renderHotbar() {
    const hotbarEl = document.getElementById('hotbar');
    hotbarEl.innerHTML = '';

    inventory.forEach((item, index) => {
        const slot = document.createElement('div');
        slot.className = `slot ${index === selectedSlot ? 'selected' : ''}`;

        const preview = document.createElement('div');
        preview.className = 'block-preview';
        preview.style.backgroundColor = BLOCK_DATA[item.type].color;

        const count = document.createElement('div');
        count.className = 'count';
        count.innerText = item.count;

        slot.appendChild(preview);
        slot.appendChild(count);
        hotbarEl.appendChild(slot);
    });
}

// --- INTERACTION ---
function handleMouseInteraction(e, isRightClick) {
    const rect = canvas.getBoundingClientRect();
    const cameraX = player.x - canvas.width / 2 + player.width / 2;
    const cameraY = player.y - canvas.height / 2 + player.height / 2;

    const mouseX = e.clientX - rect.left + cameraX;
    const mouseY = e.clientY - rect.top + cameraY;

    const tileX = Math.floor(mouseX / TILE_SIZE);
    const tileY = Math.floor(mouseY / TILE_SIZE);

    // Distance check (Reach distance)
    const pTileX = Math.floor((player.x + player.width / 2) / TILE_SIZE);
    const pTileY = Math.floor((player.y + player.height / 2) / TILE_SIZE);
    const dist = Math.hypot(tileX - pTileX, tileY - pTileY);

    if (dist > 6) return; // Out of reach

    if (!isRightClick) {
        // Break block
        const targetBlock = world[tileY]?.[tileX];
        if (targetBlock && targetBlock !== BLOCKS.AIR) {
            world[tileY][tileX] = BLOCKS.AIR;
            const invItem = inventory.find(i => i.type === targetBlock);
            if (invItem) invItem.count++;
            renderHotbar();
        }
    } else {
        // Place block
        const activeItem = inventory[selectedSlot];
        if (activeItem && activeItem.count > 0 && world[tileY]?.[tileX] === BLOCKS.AIR) {
            // Check player overlap before placing
            const blockRect = { x: tileX * TILE_SIZE, y: tileY * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
            const pRect = { x: player.x, y: player.y, w: player.width, h: player.height };

            if (!(pRect.x < blockRect.x + blockRect.w &&
                  pRect.x + pRect.w > blockRect.x &&
                  pRect.y < blockRect.y + blockRect.h &&
                  pRect.y + pRect.h > blockRect.y)) {
                
                world[tileY][tileX] = activeItem.type;
                activeItem.count--;
                renderHotbar();
            }
        }
    }
}

// --- EVENT LISTENERS ---
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', '')) - 1;
        if (num >= 0 && num < inventory.length) {
            selectedSlot = num;
            renderHotbar();
        }
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    handleMouseInteraction(e, e.button === 2);
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

// --- GAME LOOP ---
function loop() {
    updatePlayer();
    render();
    requestAnimationFrame(loop);
}

// Start Game
generateWorld();
renderHotbar();
loop();
</script>
</body>
</html>
