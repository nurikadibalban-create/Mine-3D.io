<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>MineFun Game Script</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px 40px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: white;
      border: 2px solid black;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="instructions">
    <h2>اضغط هنا للبدء باللعب</h2>
    <p>التحرك: WASD | القفز: Space</p>
    <p>تكسير المكعب: نقرة ماوس يسار | بناء مكعب: نقرة ماوس يمين</p>
  </div>
  <div id="crosshair"></div>

  <!-- مكتبات Three.js للرسم والتحكم -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    // 1. إعداد المشهد والكاميرا والإضاءة
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // لون السماء
    scene.fog = new THREE.Fog(0x87ceeb, 10, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 2. نظام التحكم (PointerLockControls)
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');

    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => instructions.style.display = 'block');

    scene.add(controls.getObject());

    // 3. بناء عالم المكعبات (Voxel World)
    const objects = []; // القائمة لتتبع المكعبات القابلة للكسر والتصادم
    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
    
    // خامة المادة لسطح العشب
    const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x4aa344 });
    const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });

    // إنشاء أرضية 16x16
    for (let x = -8; x < 8; x++) {
      for (let z = -8; z < 8; z++) {
        const cube = new THREE.Mesh(boxGeometry, grassMaterial);
        cube.position.set(x, 0, z);
        scene.add(cube);
        objects.push(cube);
      }
    }

    // موقع البداية للكاميرا فوق الأرض
    controls.getObject().position.set(0, 2, 0);

    // 4. نظام الحركة والفيزياء
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
      if (e.code === 'Space' && canJump) {
        velocity.y += 10;
        canJump = false;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
    });

    // 5. ميكانيكية البناء والتكسير باستخدام Raycaster (أزرار الماوس)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0); // منتصف الشاشة

    window.addEventListener('mousedown', (e) => {
      if (!controls.isLocked) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects);

      if (intersects.length > 0) {
        const intersect = intersects[0];

        // النقر الأيسر (Button 0): تكسير المكعب
        if (e.button === 0) {
          scene.remove(intersect.object);
          objects.splice(objects.indexOf(intersect.object), 1);
        }
        // النقر الأيمن (Button 2): بناء مكعب جديد فوق الوجه المحدد
        else if (e.button === 2) {
          const newCube = new THREE.Mesh(boxGeometry, dirtMaterial);
          newCube.position.copy(intersect.object.position).add(intersect.face.normal);
          scene.add(newCube);
          objects.push(newCube);
        }
      }
    });

    // إلغاء قائمة القائمة القافزة عند الضغط بزر الماوس الأيمن
    window.addEventListener('contextmenu', e => e.preventDefault());

    // 6. حلقة التحديث والرسم (Game Loop)
    let prevTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 25.0 * delta; // قوة الجاذبية

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
        controls.getObject().position.y += velocity.y * delta;

        // التصادم البسيط مع مستوى الأرض
        if (controls.getObject().position.y < 1.6) {
          velocity.y = 0;
          controls.getObject().position.y = 1.6;
          canJump = true;
        }
        
        prevTime = time;
      }

      renderer.render(scene, camera);
    }

    animate();

    // ضبط العرض عند تغيير حجم الشاشة
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
